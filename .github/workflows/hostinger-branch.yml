name: Preparar publicação Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preparar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Validar e exportar
        run: |
          pnpm lint
          pnpm test
          pnpm build:hostinger

      - name: Atualizar branch de publicação
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./static-site
          publish_branch: hostinger
          force_orphan: true
          enable_jekyll: true
          commit_message: "Publicação Hostinger ${{ github.sha }}"
